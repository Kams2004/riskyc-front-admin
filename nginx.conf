# Exact mirror of web/nginx.conf's structure/reasoning — see that file's own
# comment for why security-headers.conf is a shared include rather than
# add_header lines written directly in each location block.
limit_req_zone $binary_remote_addr zone=admin_web_limit:10m rate=10r/s;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    limit_req zone=admin_web_limit burst=20 nodelay;

    location / {
        include /etc/nginx/conf.d/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        include /etc/nginx/conf.d/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        include /etc/nginx/conf.d/security-headers.conf;
        add_header Cache-Control "no-cache";
    }
}
