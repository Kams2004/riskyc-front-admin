# Same shared-include reasoning as web/security-headers.conf. CSP's
# connect-src only needs admin-service's own origin (not the user-facing
# services' — this app never calls those directly, see App.tsx's own
# comment on the single-gateway design), and there's no WebSocket here at
# all (no chat/calls in this admin tool), so no ws:// entry is needed.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; connect-src 'self' http://167.86.120.214:8096; img-src 'self' data: blob:; script-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
